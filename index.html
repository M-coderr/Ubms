<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>uBMS - Unified Business & Order Management System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

  <div id="root"></div>

  <!-- React 18, ReactDOM, and Babel -->
  <script src="lib/react.min.js"></script>
  <script src="lib/react-dom.min.js"></script>
  <script src="lib/babel.min.js"></script>

  <!-- Application Modules -->
  <script src="js/data.js"></script>
  <script type="text/babel" data-presets="react" src="js/components/Header.js"></script>
  <script type="text/babel" data-presets="react" src="js/components/CustomerPortal.js"></script>
  <script type="text/babel" data-presets="react" src="js/components/AdminPortal.js"></script>
  <script type="text/babel" data-presets="react" src="js/components/InvoiceModal.js"></script>
  <script type="text/babel" data-presets="react" src="js/app.js"></script>

</body>
</html>
